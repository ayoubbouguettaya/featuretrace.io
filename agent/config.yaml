agent:
  flush_interval: 2s
  batch_size: 500
  log_level: info

inputs:
  - type: docker
    # Only containers labelled feature-trace.enabled=true are tailed.
    # options:
    #   log_root: /var/lib/docker/containers   # override for testing
    #   scan_interval: 5s                      # how often to look for new/removed containers

output:
  endpoint: localhost:50051   # gRPC ingest API (host:port)
  timeout: 5s
  max_retries: 3
  compression: true

